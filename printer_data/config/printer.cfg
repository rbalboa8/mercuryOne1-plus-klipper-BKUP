# This file contains common pin mappings for the BIGTREETECH Octopus Max EZ.
# To use this config, the firmware should be compiled for the
#
# Install katapult bootloader (Non CAN)
# cd ~
# git clone https://github.com/Arksine/katapult
#
# Compile and install katapult bootloader
# cd katapult/
# make menuconfig KCONFIG_CONFIG=octopus_max_ez.config
# settings for the BTT Octopus Max EZ: https://canbus.esoterical.online/mainboard_flashing/common_hardware/BigTreeTech%20Octopus%20Max%20EZ/README.html
# save and exit
# make clean
# make KCONFIG_CONFIG=octopus_max_ez.config -j4
# First Flash:
# put in DFU mode
# lsusb
# use id below:
# sudo dfu-util -a 0 -d 0483:df11 --dfuse-address 0x08000000:mass-erase:force -D out/katapult.bin
# Update Flash:
#
# reset board
# check board is seen
# lsusb
# ls /dev/serial/by-id/
# install Klipper firmware
# cd ~/klipper
# make clean
# make menuconfig KCONFIG_CONFIG=octopus_max_ez_klipper.config
# save and exit
# make clean
# make KCONFIG_CONFIG=octopus_max_ez_klipper.config -j4
# ls /dev/serial/by-id/
# use name below
# python3 ~/katapult/scripts/flashtool.py -f ~/klipper/out/klipper.bin -d /dev/serial/by-id/usb-katapult_stm32h723xx_250013000F51313236343430-if00
#
# STM32H723
# 128KiB bootloader
# 25 MHz crystal
# and one of:
# Communication interface: "USB (on PA11/PA12)",
# Communication interface: "CAN bus (on PD0/PD1)", or
# Communication interface: "USB to CAN bus bridge (USB on PA11/PA12))" and CAN bus interface: "CAN bus (on PD0/PD1)".

# See docs/Config_Reference.md for a description of parameters.

# Compiling the board firmware
# cd klipper
# make menuconfig
# make clean
# make
# mv out/klipper.bin out/firmware.bin
# sudo service klipper stop
# 
# Hold the DFU button on the board (BOOT0) and press reset button on the board.
# lsusb
#
# take note of the DFU device, e.g. DEVICE=0483:df11
#
# make flash FLASH_DEVICE=0483:df11
# ls /dev/serial/by-id
# sudo service klipper start
#

# Compile/upgrade Raspberry Pi MCU Firmware
#
# cd ~/klipper/
# sudo cp ./scripts/klipper-mcu.service /etc/systemd/system/
# sudo systemctl enable klipper-mcu.service
# make menuconfig
#
# Choose micro-controller Architecture (Linux process)
# Quit and save
#
# make menuconfig KCONFIG_CONFIG=rpi_klipper.config
# make KCONFIG_CONFIG=rpi_klipper.config -j4
# sudo service klipper stop
# make flash
# sudo service klipper start

# Firmware update:
# sudo service klipper stop
# cd ~/klipper
# make menuconfig
# make -j4
# Put in DFU mode
# lsusb
# make flash FLASH_DEVICE=0483:df11
# sudo service klipper start
# Note:
# File downloaded successfully
# dfu-util: Error during download get_status

# Demon_Klipper_Essentials_Unified Notes
# https://github.com/3DPrintDemon/Demon_Klipper_Essentials_Unified/tree/main

# Updating
# Original commands:
# python3 -m pip install rich
# python3 -m pip install ConfigUpdater

# Workarounds:
# ~/klippy-env/bin/pip install rich
# ~/klippy-env/bin/python3 -m pip install ConfigUpdater
# ~/klippy-env/bin/python3 ~/printer_data/config/Demon_Klipper_Essentials_Unified/Other_Files/Demon_Install_Script/Demon_config_update.py

# Not needed:
# /home/pi/klippy-env/bin/python3 -m pip install --upgrade pip

# Useful Information:
# Pin names may be preceded by ! to indicate that a reverse polarity should be used (eg, trigger on low instead of high).
# Input pins may be preceded by ^ to indicate that a hardware pull-up resistor should be enabled for the pin.
#
# Comment multiple line "command + /"


